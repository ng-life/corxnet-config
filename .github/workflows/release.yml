name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-2022
            goos: windows
            goarch: amd64
            archive: zip
          - name: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^const version = "\([^"]*\)"/\1/p' main.go)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Check formatting
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l *.go)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "$GOOS" == "windows" ]]; then EXT=".exe"; fi
          go build -trimpath -o "dist/corxnet-config$EXT" .
      - name: Verify binary version
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXT=".exe"; fi
          VERSION=$(sed -n 's/^const version = "\([^"]*\)"/\1/p' main.go)
          "./dist/corxnet-config$EXT" --version | grep -F "$VERSION"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist -czf corxnet-config-${{ matrix.name }}.tar.gz corxnet-config
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist/corxnet-config.exe -DestinationPath corxnet-config-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: corxnet-config-${{ matrix.name }}
          path: corxnet-config-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: corxnet-config-*
          merge-multiple: true
          path: dist
      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          test -s dist/corxnet-config-linux-x86_64.tar.gz
          test -s dist/corxnet-config-windows-x86_64.zip
          test -s dist/corxnet-config-macos-arm64.tar.gz
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Create version release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          TAG="$EVENT_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" dist/* --generate-notes
          fi
